<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workout Pro - สรุปเทรนเนอร์</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { font-family: 'Sarabun', sans-serif; background: #f4f7f6; margin: 0; padding: 15px; }
    .card { max-width: 1100px; background: white; padding: 20px; margin: auto; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    input, select { padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
    label { display:block; font-size: 12px; color:#555; margin-bottom: 3px; }
    button { background: #007BFF; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 5px; font-size: 14px; }
    button:hover { opacity: 0.92; }
    .logout-btn { background: #6c757d; width: auto; float: right; padding: 6px 12px; font-size: 12px; }
    .loading { text-align: center; color: #666; font-style: italic; padding: 15px; }
    hr { border: 0; border-top: 1px solid #eee; margin: 20px 0; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
    th, td { border: 1px solid #e5e5e5; padding: 6px 8px; text-align: left; }
    th { background: #f8f9fa; color: #495057; }

    .filter-bar { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 18px; }
    .filter-bar > div { display: flex; flex-direction: column; }
    .filter-bar select, .filter-bar input { margin: 0; min-width: 160px; }

    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin-bottom: 10px; }
    .kpi-card { background: #fff; border: 1px solid #e0e0e0; border-left: 5px solid #007BFF; border-radius: 8px; padding: 14px; }
    .kpi-card h4 { margin: 0 0 8px 0; font-size: 15px; color: #333; }
    .kpi-row { display:flex; justify-content: space-between; font-size: 13px; color: #555; padding: 3px 0; }
    .kpi-row b { color: #222; }
    .kpi-card .detail-btn { width: 100%; margin-top: 10px; background: #17a2b8; padding: 7px; font-size: 12px; }

    .trainer-detail { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; margin-top: 14px; overflow: hidden; }
    .trainer-detail-header { background: #f1f5ff; padding: 12px 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .trainer-detail-header h3 { margin: 0; font-size: 16px; color: #007BFF; }
    .trainer-detail-body { padding: 0 16px 16px 16px; display: none; }
    .trainer-detail-body.open { display: block; }
    .section-title { font-size: 14px; font-weight: bold; color: #333; margin: 16px 0 4px 0; border-left: 4px solid #007BFF; padding-left: 8px; }
    .empty-note { color: #999; font-size: 12px; padding: 6px 0; }

    .badge { display:inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: bold; }
    .badge-active { background: #e6f7ec; color: #28a745; }
    .badge-archived { background: #fff3cd; color: #b8860b; }
    .delta-up { color: #28a745; font-weight: bold; }
    .delta-down { color: #dc3545; font-weight: bold; }
    .delta-flat { color: #888; }

    .progression-item { border: 1px solid #eee; border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; }
    .progression-item .title-row { display:flex; justify-content: space-between; align-items:center; margin-bottom: 4px; }
    .progression-chain { font-size: 12.5px; color: #444; line-height: 1.8; }
    .load-tag { background:#eef4ff; border:1px solid #d6e4ff; border-radius: 4px; padding: 1px 6px; margin-right: 2px; }
  </style>
</head>
<body>

  <!-- หน้า Login -->
  <div id="login-section" class="card" style="max-width:420px;">
    <h2>🔐 เข้าสู่ระบบ</h2>
    <label>Username:</label>
    <input type="text" id="username" placeholder="กรอกไอดีของคุณ" style="width:100%; margin-bottom:8px;">
    <label>Password:</label>
    <input type="password" id="password" placeholder="กรอกรหัสผ่าน" style="width:100%; margin-bottom:8px;">
    <button onclick="login()" style="width:100%;">เข้าสู่ระบบ</button>
  </div>

  <!-- หน้าปฏิเสธสิทธิ์ -->
  <div id="denied-section" class="card hidden" style="max-width:420px; text-align:center;">
    <h2>🚫 ไม่มีสิทธิ์เข้าถึงหน้านี้</h2>
    <p style="color:#666;">หน้าสรุปผลเทรนเนอร์สำหรับผู้ใช้งานสิทธิ์ "เทรนเนอร์" เท่านั้น</p>
    <button onclick="location.href='?'" style="width:100%;">กลับหน้าหลัก</button>
  </div>

  <!-- หน้าสรุปผล -->
  <div id="summary-section" class="card hidden">
    <button class="logout-btn" onclick="logout()">ออกจากระบบ</button>
    <h2>📊 สรุปผลของฉัน</h2>
    <p style="color:#666; font-size:13px; margin-top:-6px;">ภาพรวมผลงานของคุณ กรองตามช่วงวันที่</p>

    <div class="filter-bar">
      <div>
        <label>จากวันที่</label>
        <input type="date" id="f-start">
      </div>
      <div>
        <label>ถึงวันที่</label>
        <input type="date" id="f-end">
      </div>
      <div>
        <button onclick="loadSummary()">🔍 ค้นหา</button>
      </div>
    </div>

    <div id="kpi-container" class="loading">กำลังโหลดข้อมูลสรุป...</div>
    <div id="detail-container"></div>
  </div>

  <script src="/api-shim.js"></script>
  <script>
    var currentUser = {};

    // บังคับซ่อนหน้า "ไม่มีสิทธิ์" และ "สรุปผลของฉัน" ไว้ก่อนเสมอตั้งแต่เริ่มโหลดหน้า
    // จะแสดงก็ต่อเมื่อเช็ค login/role สำเร็จเท่านั้น (ผ่านฟังก์ชัน enterAppByRole ด้านล่าง)
    document.getElementById('denied-section').style.display = 'none';
    document.getElementById('summary-section').style.display = 'none';

    window.onload = function() {
      var savedUser = localStorage.getItem('workout_current_user');
      if (savedUser) {
        try {
          currentUser = JSON.parse(savedUser);
          if (!currentUser.name || currentUser.name === "undefined") {
            localStorage.removeItem('workout_current_user');
            currentUser = {};
            return;
          }
          enterAppByRole(currentUser);
        } catch (e) {
          localStorage.removeItem('workout_current_user');
        }
      }
    };

    function enterAppByRole(res) {
      document.getElementById('login-section').style.display = 'none';
      var role = String(res.role || '').trim().toLowerCase();
      if (role === 'trainer') {
        document.getElementById('denied-section').style.display = 'none';
        document.getElementById('summary-section').style.display = 'block';
        initDefaultDateRange();
        loadSummary();
      } else {
        document.getElementById('summary-section').style.display = 'none';
        document.getElementById('denied-section').style.display = 'block';
      }
    }

    function login() {
      var u = document.getElementById('username').value;
      var p = document.getElementById('password').value;

      Swal.fire({ title: 'กำลังเข้าสู่ระบบ...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

      google.script.run
        .withSuccessHandler(function(res) {
          Swal.close();
          if (res.status === "success") {
            currentUser = res;
            localStorage.setItem('workout_current_user', JSON.stringify(res));
            enterAppByRole(res);
          } else {
            Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: res.message });
          }
        })
        .withFailureHandler(function(err) {
          Swal.close();
          Swal.fire({ icon: 'error', title: 'ระบบขัดข้อง', text: err.message });
        })
        .checkLogin(u, p);
    }

    function logout() {
      localStorage.removeItem('workout_current_user');
      document.getElementById('summary-section').style.display = 'none';
      document.getElementById('denied-section').style.display = 'none';
      document.getElementById('login-section').style.display = 'block';
      currentUser = {};
    }

    function initDefaultDateRange() {
      var today = new Date();
      var firstOfMonth = new Date(today.getFullYear(), today.getMonth(), 1);
      document.getElementById('f-start').valueAsDate = firstOfMonth;
      document.getElementById('f-end').valueAsDate = today;
    }

    function loadSummary() {
      var start = document.getElementById('f-start').value;
      var end = document.getElementById('f-end').value;

      document.getElementById('kpi-container').innerHTML = "<p class='loading'>กำลังโหลดข้อมูลสรุป...</p>";
      document.getElementById('detail-container').innerHTML = '';

      google.script.run
        .withSuccessHandler(function(trainers) {
          renderKPI(trainers || []);
          renderDetails(trainers || []);
        })
        .withFailureHandler(function(err) {
          document.getElementById('kpi-container').innerHTML = "<p style='color:#dc3545; text-align:center;'>เกิดข้อผิดพลาด: " + err.message + "</p>";
        })
        .getTrainerOverviewSummary(start, end, currentUser.name);
    }

    function slug(str) {
      return String(str).replace(/[^a-zA-Z0-9ก-๙]/g, '_');
    }

    function renderKPI(trainers) {
      var container = document.getElementById('kpi-container');
      if (!trainers.length) {
        container.innerHTML = "<p style='text-align:center; color:#888;'>ไม่พบข้อมูลในช่วงวันที่ที่เลือก</p>";
        return;
      }
      var html = '<div class="kpi-grid">';
      trainers.forEach(function(t) {
        html += `
          <div class="kpi-card">
            <h4>🧑‍🏫 ${t.trainer}</h4>
            <div class="kpi-row"><span>📋 จำนวนโปรแกรม</span><b>${t.programCount}</b></div>
            <div class="kpi-row"><span>🏋️ จำนวนท่าที่ออกโปรแกรม</span><b>${t.exerciseCount}</b></div>
            <div class="kpi-row"><span>📝 การรายงานของลูกค้า</span><b>${t.clientReportCount}</b></div>
            <div class="kpi-row"><span>📞 การติดตาม</span><b>${t.followUpCount}</b></div>
            <button class="detail-btn" onclick="scrollToDetail('${slug(t.trainer)}')">🔍 ดูรายละเอียด</button>
          </div>`;
      });
      html += '</div>';
      container.innerHTML = html;
    }

    function scrollToDetail(id) {
      var el = document.getElementById('detail-' + id);
      if (!el) return;
      var body = el.querySelector('.trainer-detail-body');
      if (body && !body.classList.contains('open')) body.classList.add('open');
      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function toggleDetail(id) {
      var body = document.getElementById('body-' + id);
      if (body) body.classList.toggle('open');
    }

    function renderDetails(trainers) {
      var container = document.getElementById('detail-container');
      if (!trainers.length) { container.innerHTML = ''; return; }

      var html = '';
      trainers.forEach(function(t) {
        var id = slug(t.trainer);
        html += `<div class="trainer-detail" id="detail-${id}">`;
        html += `<div class="trainer-detail-header" onclick="toggleDetail('${id}')"><h3>🧑‍🏫 ${t.trainer}</h3><span>▾ คลิกเพื่อดู/ซ่อนรายละเอียด</span></div>`;
        html += `<div class="trainer-detail-body open" id="body-${id}">`;

        // 1) รายการโปรแกรม
        html += `<div class="section-title">📋 รายการโปรแกรมที่ออก (${t.programCount})</div>`;
        if (t.programs.length) {
          html += `<table><tr><th>วันที่</th><th>ลูกค้า</th><th>ชื่อโปรแกรม</th><th>จำนวนท่า</th><th>สถานะ</th></tr>`;
          t.programs.forEach(function(p) {
            var badge = p.status === 'Archived' ? '<span class="badge badge-archived">ประวัติเก่า</span>' : '<span class="badge badge-active">ปัจจุบัน</span>';
            html += `<tr><td>${p.date}</td><td>${p.client}</td><td>${p.groupName}</td><td>${p.exerciseCount}</td><td>${badge}</td></tr>`;
          });
          html += `</table>`;
        } else {
          html += `<p class="empty-note">ไม่มีโปรแกรมในช่วงวันที่นี้</p>`;
        }

        // 2) การรายงานของลูกค้า
        html += `<div class="section-title">📝 การรายงานของลูกค้า (${t.clientReportCount})</div>`;
        if (t.clientReports.length) {
          html += `<table><tr><th>วันที่</th><th>ลูกค้า</th><th>โปรแกรม</th><th>โน้ต/ผลตอบรับ</th></tr>`;
          t.clientReports.forEach(function(r) {
            html += `<tr><td>${r.date}</td><td>${r.clientName}</td><td>${r.programGroup}</td><td>${r.note || '-'}</td></tr>`;
          });
          html += `</table>`;
        } else {
          html += `<p class="empty-note">ยังไม่มีลูกค้ารายงานผลในช่วงวันที่นี้</p>`;
        }

        // 3) การติดตาม
        html += `<div class="section-title">📞 การติดตามลูกค้า (${t.followUpCount})</div>`;
        if (t.followUps.length) {
          html += `<table><tr><th>วันที่</th><th>ลูกค้า</th><th>เป้าหมาย</th><th>สถานะ</th><th>คอมเมนต์</th></tr>`;
          t.followUps.forEach(function(f) {
            html += `<tr><td>${f.date}</td><td>${f.username}</td><td>${f.goalType}<br><small>${f.targetValue}</small></td><td>${f.currentStatus}</td><td>${f.trainerNote}</td></tr>`;
          });
          html += `</table>`;
        } else {
          html += `<p class="empty-note">ยังไม่มีการอัปเดตการติดตามในช่วงวันที่นี้</p>`;
        }

        // 4) Progression น้ำหนักของท่า
        html += `<div class="section-title">📈 น้ำหนักของท่า (Progression) — เฉพาะท่าที่มีการเปลี่ยนแปลง</div>`;
        if (t.progression.length) {
          t.progression.forEach(function(p) {
            var deltaClass = p.deltaDir === 'up' ? 'delta-up' : (p.deltaDir === 'down' ? 'delta-down' : 'delta-flat');
            html += `<div class="progression-item">`;
            html += `<div class="title-row"><span><b>${p.client}</b> — ${p.exercise}</span><span class="${deltaClass}">${p.deltaText}</span></div>`;
            html += `<div class="progression-chain">`;
            p.entries.forEach(function(e, idx) {
              html += `<span class="load-tag">${e.date}: ${e.load || '-'}${e.status === 'Archived' ? ' 🕓' : ''}</span>`;
              if (idx < p.entries.length - 1) html += ' → ';
            });
            html += `</div></div>`;
          });
        } else {
          html += `<p class="empty-note">ยังไม่มีท่าที่มีการเปลี่ยนน้ำหนักในช่วงวันที่นี้</p>`;
        }

        html += `</div></div>`;
      });

      container.innerHTML = html;
    }
  </script>
</body>
</html>
